name: Verify

# Generated output is not committed, so there is nothing to check for drift here.
# What must hold is that the test suite passes on every supported platform.

on:
  # Pushes to a pull request's branch are covered by the pull_request event, so
  # push runs only on main. Without the filter every PR commit runs twice.
  push:
    branches: [main]
    paths: ['standards/**', 'build.ps1', 'build.sh', 'install.ps1', 'install.sh', 'test.sh', '.github/workflows/verify-generators.yml']
  pull_request:
    paths: ['standards/**', 'build.ps1', 'build.sh', 'install.ps1', 'install.sh', 'test.sh', '.github/workflows/verify-generators.yml']
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A healthy Windows run takes 5-10 minutes. Without a limit, a genuine hang
    # holds the runner for GitHub's 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu runs the suite under dash; Git for Windows supplies a POSIX sh.
        # macOS is deliberately not in the matrix. Note that removes the only
        # runner with bash 3.2 as /bin/sh, which is stricter than both of these,
        # so bash 3.2 regressions will no longer be caught here. See the platform
        # gotchas in CONTRIBUTING.md.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Fails in seconds with a plain syntax error, rather than part-way through
      # a generation run.
      - name: Shell scripts parse
        shell: bash
        run: |
          sh -n ./build.sh
          sh -n ./install.sh
          sh -n ./test.sh

      - name: Test suite
        shell: bash
        run: sh ./test.sh
