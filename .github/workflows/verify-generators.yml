name: Verify

# Generated output is not committed, so there is nothing to check for drift here.
# What must hold is that the test suite passes on every supported platform.

on:
  push:
    paths: ['standards/**', 'build.ps1', 'build.sh', 'install.ps1', 'install.sh', 'test.sh', '.github/workflows/verify-generators.yml']
  pull_request:
    paths: ['standards/**', 'build.ps1', 'build.sh', 'install.ps1', 'install.sh', 'test.sh', '.github/workflows/verify-generators.yml']
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Git for Windows supplies a POSIX sh, so the suite runs on all three.
        # macOS ships bash 3.2 as /bin/sh, which rejects constructs dash accepts;
        # that platform is the real gate for shell portability.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Fails in seconds with a plain syntax error, rather than part-way through
      # a generation run.
      - name: Shell scripts parse
        shell: bash
        run: |
          sh -n ./build.sh
          sh -n ./install.sh
          sh -n ./test.sh

      - name: Test suite
        shell: bash
        run: sh ./test.sh
